version: '3'
services:
  cvmfs:
    image: registry.cern.ch/cvmfs/service:latest
    environment:
      - CVMFS_CLIENT_PROFILE=single
      - CVMFS_REPOSITORIES=sft.cern.ch,atlas.cern.ch,lhcb.cern.ch,cms.cern.ch,alice.cern.ch,geant4.cern.ch
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - /cvmfs:/cvmfs:shared
